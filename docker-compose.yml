services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smarttrip
      POSTGRES_USER: smarttrip
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
